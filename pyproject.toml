[project]
name = "vtl"
version = "0.1.0"
description = "Incident timeline generator: merge Wazuh alerts, Windows event logs and Linux auth logs into one chronological investigation timeline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MrWaifu24" }]
requires-python = ">=3.10"
keywords = ["soc", "dfir", "incident-response", "timeline", "wazuh", "evtx", "auth.log", "forensics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = [
    "python-evtx>=0.8",
    "rich>=13.7",
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/MrWaifu24/vtl"
Issues = "https://github.com/MrWaifu24/vtl/issues"

[project.scripts]
vtl = "vtl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
